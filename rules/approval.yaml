# 결재선 규칙 — 스키마만. 값은 근거 문서(위임전결규정·조직도)가 오면 채운다.
#
# 이 파일의 목적은 "규칙이 뼈대, LLM 은 후보 안에서 선택"의 **뼈대**를 담는 것이다.
# 같은 스키마로 두 벌을 만든다.
#   rules/approval.induced.yaml   gold 이력에서 귀납한 것 (비교군)
#   rules/approval.official.yaml  위임전결규정 문서를 파싱한 것 (정본)
# 둘의 차이를 evaluate/rules_diff.py 가 낸다 — "규정 없이 이력만으로 가면 어디서 틀리나".

meta:
  schema_version: 1
  source: ""          # induced | official
  source_docs: []     # official 일 때 근거 문서 파일명·쪽수
  generated_at: ""

# 1층 — 명부. 조직 → 직위 → 이름.
# 실명이 들어가므로 **리포 밖**에 두고 여기서는 경로만 가리킨다.
roster:
  path: "~/data/who-approved-this/t1/roster.tsv"   # 조직 \t 직위 \t 이름 \t 유효기간
  # 명부에 없는 이름을 LLM 이 내면 reject 한다(환각 방어).
  reject_unknown_names: true

organizations:
  # 조직 키는 gold 의 org 열과 같다(문서 하단 발신명의 기준).
  - key: ""                    # 예: 경기도서관
    parent: ""                 # 상위 기관. 예: 경기도
    # 1층 — 기본 결재 계층. 아래에서 위로 올라가는 순서.
    # 각 단계는 "직위"만 적는다. 사람은 roster 에서 붙인다.
    chain:
      draft: ""                # 기안 직위. 예: 주무관
      review: []               # 검토 직위 순서. 예: [도서관운영팀장, 도서관정책팀장]
      approve: ""              # 최종 결재 직위(전결 적용 전). 예: 경기도서관장

    # 2층 — 전결·대결.
    # 전결(delegation): 규정상 최종 결재권이 아래 직위로 내려간 상태.
    #   이때 원 결재권자 칸은 **인쇄되지만 이름이 비는** 경우가 있다(관보/공문 관행).
    #   실측 사례: 경기도서관-10185 — 관장 칸에 "전결"만 찍히고 이름 없음,
    #   정책팀장 칸에 "대결"과 날짜. gold 에서는 이름을 "?"로 두고 채점 제외했다.
    # 대결(acting): 결재권자 부재 시 대신 결재한 사람. 전결과 별개로 표시된다.
    delegation:
      default_final: ""        # 평상시 최종 결재 직위
      rules: []                # 아래 delegation_rule 목록
      # 칸 표현 규칙 — 예측기가 칸을 만들 때 따라야 한다.
      cell_policy:
        delegated_cell:
          printed: true        # 원 결재권자 칸을 인쇄하는가
          name_empty: true     # 그 칸의 이름을 비우는가
          mark: "전결"
        acting_cell:
          mark: "대결"
          carries_date: true

    # 3층 — 문서 유형별 협조.
    cooperation: []            # 아래 cooperation_rule 목록

    # 4층 이력 다수결, 5층 LLM 선택은 코드 쪽 기본값이라 여기 적지 않는다.

# --- 아래는 위에서 참조하는 목록의 형태 정의(문서용). 실제 값은 organizations 안에 들어간다. ---

_shapes:
  delegation_rule:
    doc_type: ""             # 지출 | 계약 | 계획 | 결과보고 | 알림 | 기타
    amount_min: null         # 금액 구간. 없으면 null. 단위: 원
    amount_max: null
    final_title: ""          # 이 구간의 전결권자 직위
    note: ""                 # 규정 조문·별표 번호

  cooperation_rule:
    doc_type: ""             # 예: 지출
    trigger: ""              # 조건. 예: "예산 집행" | "계약 체결" | "always"
    titles: []               # 협조 칸에 들어갈 직위 목록. 예: [경리팀장]
    required: true           # 필수 협조인지
    note: ""                 # 근거 조문

# 규칙이 커버하지 못하는 칸은 4층(이력 다수결) → 5층(LLM 선택) 순으로 내려간다.
# 칸마다 근거 태그를 단다: roster | rule | vote | llm
fallback:
  order: [rule, vote, llm]
  tag_field: "evidence"
