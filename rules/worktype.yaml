# 업무항목 분류표 — 전결위임표의 "사무 구분" 행을 흉내 낸 것.
#
# 실제 전결위임표는 이런 행을 갖는다(경기도 사무전결처리규칙 별표1 형태):
#     사무의 종류                          | 기관장 | 부기관장 | 과장
#     실·과소관 회계지출 및 물품관리         |   ○    |         |
#     소관 사업계획 수립·시행               |        |    ○    |
#
# 결재선을 자동 지정하려면 **문서가 어느 행인지** 먼저 정해야 한다. 그 분류 정확도를
# 재는 게 이 표의 목적이다. 조회(행 → 전결권자)는 그 다음의 단순 lookup 이다.
#
# 정답 라벨은 사람이 제목·본문을 보고 붙였다. 실명은 없다.

meta:
  schema_version: 1
  purpose: "문서 → 전결표 업무항목 분류 정확도 측정"
  note: "실제 전결표가 오면 이 분류 체계를 그 별표의 행으로 교체한다"

types:
  - key: 회계지출
    desc: 예산 집행·지급·물품 구입. 금액이 본문에 나온다
  - key: 계약·검사
    desc: 용역·공사 계약, 기성검사·준공검사와 그 결과
  - key: 사업계획
    desc: 사업·행사·프로그램을 하겠다는 계획 수립
  - key: 결과보고
    desc: 사업·출장을 마치고 결과를 보고
  - key: 인사·복무
    desc: 임용·호봉·승진·복무 관리
  - key: 회의·심의
    desc: 위원회·협의회 개최, 회의록, 심의 결과
  - key: 대외제출·통보
    desc: 외부 기관·의원 요구자료 제출, 승인·통보

